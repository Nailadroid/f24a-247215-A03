<!DOCTYPE html>
<html>
<head>
    <title>Assignment 3 - 247215</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function Stall() {
            const [stall, setStall] = useState(5);
            return (
                <div>
                    <button onClick={() => setStall(stall - 1)}>Honey {stall}</button>
                    <button onClick={() => setStall(stall - 1)}>Jam {stall}</button>
                    <Tin />
                </div>
            );
        }

        function Tin() {
            const [tin, setTin] = useState(5);
            return <button>Oil {tin}</button>;
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<Stall />);
    </script>

</body>
</html>
